site_name: 量化开发学习计划
site_description: 从零到量化开发工程师 - 四轨并行(量化/AI/后端/考研)
repo_url: https://github.com/radiumno/study_plan
site_url: https://radiumno.github.io/study_plan
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  icon:
    logo: fontawesome/solid/chart-line
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - admonition
  - footnotes
  - tables
  - attr_list

nav:
  - 首页: index.md
  - 学习路线:
    - 主脉络: resources/主脉络.md
    - 分脉络 (阶段1):
      - Python基础: plans/阶段1_Python_分脉络大纲.md
    - 分脉络 (后续):
      - C++算法: plans/阶段2_C++算法_分脉络大纲.md
      - C++深入: plans/阶段3_C++深入_分脉络大纲.md
      - 量化+AI: plans/阶段4_量化核心AI_分脉络大纲.md
      - 实习冲刺: plans/阶段5-6_实习与冲刺_分脉络大纲.md
  - 教程:
    - 教程索引: tutorials/index.md
  - 资源库:
    - 资源库索引: resources/index.md
  - 周审: workflows/周审流程.md
  - 参考资料:
    - AI 辅线: references/ai-side/README.md
    - AI Engineering 索引: references/ai-side/ai-engineering.md
    - Phase 10: references/ai-side/phase-10-llms-from-scratch.md
    - Phase 13: references/ai-side/phase-13-tools-and-protocols.md
    - Phase 14: references/ai-side/phase-14-agent-engineering.md
    - 其他 AI Phases: references/ai-side/其他-phase.md
    - Phase 4: references/ai-side/phase-04-computer-vision.md
    - Phase 5: references/ai-side/phase-05-nlp.md
    - Phase 12: references/ai-side/phase-12-multimodal.md
    - Phase 15: references/ai-side/phase-15-autonomous.md
    - Phase 16: references/ai-side/phase-16-multi-agent.md
    - Phase 17: references/ai-side/phase-17-infra.md
    - Phase 18: references/ai-side/phase-18-ethics.md
    - Phase 19: references/ai-side/phase-19-capstone.md
    - Git 速查: references/cheatsheets/git基础.md
    - 审计复盘: reviews/audit-2026-05-31.md
    - 历史归档:
      - 遗漏知识点归档: archive/遗漏.py
      - Day 03 学习汇报: archive/day03_学习汇报.md
  - 规划补充:
    - 技能需求-权重矩阵: plans/技能需求-权重矩阵.md
    - AI辅线分脉络: plans/ai-side/AI辅线_分脉络大纲.md
    - easy-vibe 启动计划: plans/ai-side/easy-vibe-启动计划.md
  - 工作流:
    - 写课程流程: workflows/写课程流程.md
    - 写脉络流程: workflows/写脉络流程.md
  - 考研: plans/考研备考对照表.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radiumno/study_plan
