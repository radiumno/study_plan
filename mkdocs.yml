site_name: 量化开发学习计划
site_description: Python数据闭环 -> C++系统能力 -> 量化交易系统
repo_url: https://github.com/radiumno/study_plan
site_url: https://radiumno.github.io/study_plan
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  icon:
    logo: fontawesome/solid/chart-line
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - admonition
  - footnotes
  - tables
  - attr_list

nav:
  - 首页: index.md
  - 路线与证据:
    - 主脉络: resources/主脉络.md
    - 规划层级与滚动执行: plans/规划层级与滚动执行规则.md
    - 招聘市场调研: resources/招聘市场调研报告.md
    - 技能需求矩阵: plans/技能需求-权重矩阵.md
    - 核心学习资源: resources/核心学习资源清单.md
  - 阶段计划:
    - 阶段1 Python数据闭环: plans/阶段1_Python_分脉络大纲.md
    - 阶段2 C++与算法: plans/阶段2_C++算法_分脉络大纲.md
    - 阶段3 C++系统与性能: plans/阶段3_C++深入_分脉络大纲.md
    - 阶段4 量化系统核心: plans/阶段4_量化核心AI_分脉络大纲.md
    - 阶段5-6 实习与冲刺: plans/阶段5-6_实习与冲刺_分脉络大纲.md
    - AI工具化辅线: plans/ai-side/AI辅线_分脉络大纲.md
  - 教程:
    - 教程索引: tutorials/index.md
  - 资源:
    - 资源索引: resources/index.md
    - 候选资源库: resources/lib/资源库.md
  - 工作流:
    - 写课程流程: workflows/写课程流程.md
    - 写脉络流程: workflows/写脉络流程.md
    - 周审流程: workflows/周审流程.md
  - 质量规则:
    - 学习量校准: plans/学习量校准规则.md
    - 练习依赖校准: plans/练习依赖校准规则.md
    - 实战触发点: plans/实战触发点路线图.md
    - 开源项目拆解: plans/开源项目拆解路线图.md
  - 参考资料:
    - AI参考资料库: references/ai-side/README.md
    - AI Engineering索引: references/ai-side/ai-engineering.md
    - Git速查: references/cheatsheets/git基础.md
    - 审查 2026-07-10: reviews/audit-2026-07-10.md
    - 历史审查 2026-05-31: reviews/audit-2026-05-31.md
  - 考研:
    - 考研对照表: plans/考研备考对照表.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radiumno/study_plan
