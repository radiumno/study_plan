name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python3 scripts/checks.py tests
      - name: Run docs checks
        run: python3 scripts/checks.py docs
      - name: Run course checks
        run: python3 scripts/checks.py course
